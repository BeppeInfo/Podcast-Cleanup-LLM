# Bring the interface up against models you are already running.
#
#   docker compose up --build
#   open http://127.0.0.1:8000
#
# Transcription runs in this image; WhisperX is installed here and needs no
# server. The detector is not — point LLAMA_ENDPOINT at wherever it runs, and
# if that is this same machine see the note under `extra_hosts` below.

services:
  cleanup:
    build:
      context: .
      target: runtime
    # 127.0.0.1 on purpose. There is no authentication here and ffmpeg is handed
    # whatever is uploaded, so this belongs on a machine you trust. Change it
    # only if you know what is in front of it.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      # Model weights, downloaded on first use and worth keeping: the aligner
      # alone is 360 MB and the whisper model is on top of that. Without this
      # every rebuilt container re-downloads them before it can transcribe.
      - ./models:/models
    environment:
      # The one server left. Transcription is local to this container.
      LLAMA_ENDPOINT: "${LLAMA_ENDPOINT:-http://host.docker.internal:8080}"
      # Bigger is a better transcript and, with no CUDA, a much longer wait.
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      # A llama-server in router mode needs to be told which model to load.
      LLAMA_MODEL_NAME: "${LLAMA_MODEL_NAME:-}"
      WHISPER_LANG: "${WHISPER_LANG:-auto}"
      # Without this Whisper returns fluent prose and the disfluencies never
      # reach the detector. See DESIGN.md §6 — it matters more than it looks.
      WHISPER_PROMPT: "${WHISPER_PROMPT:-Um, uh, so, like, you know, I mean — um, that's, that's the thing.}"
      # Anything else is set on the Settings page and kept in data/settings.json.
    # Lets the host.docker.internal name above resolve on Linux, where it
    # otherwise would not. If the detector is on another machine, name it in the
    # endpoint instead and this line does nothing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# The volume is a bind mount rather than a named volume so the finished episodes
# are somewhere you can reach without docker: ./data/output/<episode>/.
